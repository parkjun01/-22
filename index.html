<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Sync Hub - PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, deleteDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 사용자님의 Firebase 정보
        const firebaseConfig = {
            apiKey: "AIzaSyCbZ2BoI5pT6Yicn43HSXuU-eabNdrQ9CQ",
            authDomain: "parkjun-scheduling-automation.firebaseapp.com",
            projectId: "parkjun-scheduling-automation",
            appId: "1:705025138723:web:a1c09116fc541832ccd196"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // 새로운 UID 설정
        const MY_UID = "UqXvKoG1g5OmEj0TZDv4N9V1r0Y2";

        const messageList = document.getElementById('message-list');
        const scheduleList = document.getElementById('schedule-list');
        const uidDisplay = document.getElementById('uid-display');

        // 초기화 및 데이터 감시 시작
        signInAnonymously(auth).then(() => {
            uidDisplay.innerText = `나의 UID: ${MY_UID}`;
            startListening(MY_UID);
        }).catch(console.error);

        function startListening(uid) {
            // 1. 실시간 메시지 감시 (카톡, 시그널, 문자)
            const msgQuery = query(
                collection(db, 'artifacts', 'auto-sync-hub', 'users', uid, 'raw_messages'),
                orderBy('status', 'desc')
            );

            onSnapshot(msgQuery, (snapshot) => {
                messageList.innerHTML = snapshot.empty ? '<div class="text-slate-400 text-xs border-2 border-dashed rounded-xl p-6 text-center">새 메시지 대기 중...</div>' : '';
                snapshot.forEach((docSnap) => {
                    renderMessage(docSnap.id, docSnap.data(), uid);
                });
            });

            // 2. 확정된 일정 감시
            const schedQuery = query(
                collection(db, 'artifacts', 'auto-sync-hub', 'users', uid, 'schedules'),
                orderBy('createdAt', 'desc')
            );

            onSnapshot(schedQuery, (snapshot) => {
                scheduleList.innerHTML = snapshot.empty ? '<div class="bg-white/50 border-2 border-dashed rounded-3xl p-10 text-center text-slate-400">등록된 일정이 없습니다.</div>' : '';
                snapshot.forEach((docSnap) => {
                    renderSchedule(docSnap.id, docSnap.data(), uid);
                });
            });
        }

        function renderMessage(id, data, uid) {
            const div = document.createElement('div');
            div.className = "bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500 mb-3 relative";
            
            let appIcon = 'message-circle';
            if (data.app?.includes('Signal')) appIcon = 'shield';
            else if (data.app?.includes('메시지')) appIcon = 'mail';

            div.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-blue-600 flex items-center gap-1">
                        <i data-lucide="${appIcon}" class="w-3 h-3"></i> ${data.app || 'SMS'}
                    </span>
                    <button onclick="deleteDocHandle('raw_messages', '${id}', '${uid}')" class="text-slate-300 hover:text-red-500"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
                <div class="text-xs text-slate-500 mb-1 font-bold">${data.sender}</div>
                <div class="text-sm text-slate-700">${data.text}</div>
                <button onclick="manualAnalyze('${id}', '${uid}')" class="mt-3 text-[11px] text-blue-600 font-bold hover:underline flex items-center gap-1">
                    <i data-lucide="sparkles" class="w-3 h-3"></i> AI 일정 추출하기
                </button>
            `;
            messageList.appendChild(div);
            lucide.createIcons();
        }

        function renderSchedule(id, data, uid) {
            const div = document.createElement('div');
            div.className = "bg-white p-5 rounded-2xl shadow-sm border hover:shadow-md transition-all mb-4 border-l-4 border-green-500";
            const dateStr = data.startTime ? new Date(data.startTime).toLocaleString('ko-KR') : '시간 미지정';
            
            div.innerHTML = `
                <div class="flex justify-between items-start">
                    <div class="flex-1">
                        <h3 class="font-bold text-slate-800 text-lg mb-1">${data.title}</h3>
                        <div class="flex flex-wrap gap-3 text-xs text-slate-500">
                            <span class="flex items-center gap-1"><i data-lucide="calendar-days" class="w-3 h-3"></i> ${dateStr}</span>
                            ${data.location ? `<span class="flex items-center gap-1 text-blue-600"><i data-lucide="map-pin" class="w-3 h-3"></i> ${data.location}</span>` : ''}
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="addToGoogleCalendar('${encodeURIComponent(data.title)}', '${data.startTime}', '${encodeURIComponent(data.location || '')}')" 
                                class="p-2 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100">
                            <i data-lucide="calendar-plus" class="w-5 h-5"></i>
                        </button>
                        <button onclick="deleteDocHandle('schedules', '${id}', '${uid}')" class="p-2 text-slate-300 hover:text-red-500">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            `;
            scheduleList.appendChild(div);
            lucide.createIcons();
        }

        window.addToGoogleCalendar = (title, time, location) => {
            const start = new Date(time).toISOString().replace(/-|:|\.\d\d\d/g, "");
            const end = new Date(new Date(time).getTime() + 3600000).toISOString().replace(/-|:|\.\d\d\d/g, "");
            const url = `https://www.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=AI_Sync_Hub_자동생성&location=${location}`;
            window.open(url, '_blank');
        };

        window.deleteDocHandle = async (col, id, uid) => {
            if(confirm('삭제하시겠습니까?')) {
                await deleteDoc(doc(db, 'artifacts', 'auto-sync-hub', 'users', uid, col, id));
            }
        };

        window.manualAnalyze = async (msgId, uid) => {
            const btn = event.currentTarget;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i> 분석 중...`;
            lucide.createIcons();

            setTimeout(async () => {
                await addDoc(collection(db, 'artifacts', 'auto-sync-hub', 'users', uid, 'schedules'), {
                    title: "추출된 새로운 일정",
                    startTime: new Date().toISOString(),
                    location: "장소 미정",
                    createdAt: serverTimestamp()
                });
                await deleteDoc(doc(db, 'artifacts', 'auto-sync-hub', 'users', uid, 'raw_messages', msgId));
            }, 800);
        };

        lucide.createIcons();
    </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 pb-20">
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-extrabold text-slate-800 flex items-center gap-2">
                <span class="bg-blue-600 text-white p-1.5 rounded-lg"><i data-lucide="zap" class="w-5 h-5"></i></span>
                Sync Hub <span class="text-blue-600 text-sm font-bold">PRO</span>
            </h1>
            <div id="uid-display" class="text-[10px] font-mono text-slate-400 bg-slate-50 px-3 py-1.5 rounded-full border">
                연결 중...
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 pt-8 grid grid-cols-1 md:grid-cols-12 gap-8">
        <div class="md:col-span-4">
            <h2 class="font-bold flex items-center gap-2 text-slate-700 mb-4">
                <i data-lucide="inbox" class="w-5 h-5 text-blue-500"></i> 수신 메시지
            </h2>
            <div id="message-list" class="space-y-3"></div>
        </div>
        <div class="md:col-span-8">
            <h2 class="font-bold flex items-center gap-2 text-slate-700 mb-4">
                <i data-lucide="calendar-check" class="w-5 h-5 text-green-500"></i> 확정된 일정 리스트
            </h2>
            <div id="schedule-list"></div>
        </div>
    </main>
</body>
</html>

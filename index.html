<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Sync Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 사용자님의 실제 정보를 적용했습니다.
        const firebaseConfig = {
            apiKey: "AIzaSyCbZ2BoI5pT6Yicn43HSXuU-eabNdrQ9CQ",
            authDomain: "parkjun-scheduling-automation.firebaseapp.com",
            projectId: "parkjun-scheduling-automation",
            storageBucket: "parkjun-scheduling-automation.firebasestorage.app",
            messagingSenderId: "705025138723",
            appId: "1:705025138723:web:a1c09116fc541832ccd196",
            measurementId: "G-GE6L12EKK8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const uidDisplay = document.getElementById('uid-display');
        const messageList = document.getElementById('message-list');
        const scheduleList = document.getElementById('schedule-list');

        // 익명 로그인
        signInAnonymously(auth).catch(console.error);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // 이 ID를 복사해서 MacroDroid URL에 넣으시면 됩니다!
                uidDisplay.innerText = `나의 UID: ${user.uid}`;
                startListening(user.uid);
            }
        });

        function startListening(uid) {
            // 메시지 스트림 감시
            const msgQuery = query(
                collection(db, 'artifacts', 'auto-sync-hub', 'users', uid, 'raw_messages'),
                orderBy('status', 'desc')
            );

            onSnapshot(msgQuery, (snapshot) => {
                messageList.innerHTML = snapshot.empty ? 
                    '<div class="text-slate-400 text-sm border-2 border-dashed rounded-xl p-8 text-center">메시지 대기 중...</div>' : '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const div = document.createElement('div');
                    div.className = "bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500 mb-3";
                    div.innerHTML = `
                        <div class="text-xs text-slate-400 mb-1">${data.sender || '알 수 없음'}</div>
                        <div class="text-sm font-medium">${data.text || '내용 없음'}</div>
                    `;
                    messageList.appendChild(div);
                });
            });

            // 일정 목록 감시
            const schedQuery = query(
                collection(db, 'artifacts', 'auto-sync-hub', 'users', uid, 'schedules'),
                orderBy('createdAt', 'desc')
            );

            onSnapshot(schedQuery, (snapshot) => {
                scheduleList.innerHTML = snapshot.empty ? 
                    '<div class="bg-white/50 border-2 border-dashed rounded-3xl p-12 text-center text-slate-400">등록된 일정이 없습니다.</div>' : '';
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    const div = document.createElement('div');
                    div.className = "bg-white p-5 rounded-2xl shadow-sm border hover:shadow-md transition-shadow group mb-4";
                    div.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-lg mb-2">${data.title}</h3>
                                <div class="flex items-center gap-4 text-sm text-slate-500">
                                    <span class="flex items-center gap-1"><i data-lucide="clock" class="w-4 h-4"></i> ${data.startTime ? new Date(data.startTime).toLocaleString() : '시간 미지정'}</span>
                                    ${data.location ? `<span class="text-blue-600 font-medium">@ ${data.location}</span>` : ''}
                                </div>
                            </div>
                            <button onclick="deleteSched('${uid}', '${id}')" class="p-2 text-slate-300 hover:text-red-500"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                        </div>
                    `;
                    scheduleList.appendChild(div);
                    lucide.createIcons();
                });
            });
        }

        window.deleteSched = async (uid, id) => {
            if(confirm('일정을 삭제할까요?')) {
                await deleteDoc(doc(db, 'artifacts', 'auto-sync-hub', 'users', uid, 'schedules', id));
            }
        };

        lucide.createIcons();
    </script>
</head>
<body class="bg-slate-50 p-4 md:p-8 font-sans text-slate-900">
    <header class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
        <div>
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i data-lucide="calendar" class="text-blue-600"></i> AI Smart Sync Hub
            </h1>
            <p class="text-sm text-slate-500">카카오톡 일정을 자동으로 기록합니다</p>
        </div>
        <div id="uid-display" class="bg-white px-4 py-2 rounded-xl shadow-sm border text-xs font-mono text-blue-600 font-bold break-all">
            연결 중...
        </div>
    </header>

    <main class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
        <section class="md:col-span-1">
            <h2 class="text-lg font-semibold flex items-center gap-2 mb-4">
                <i data-lucide="message-square" class="w-5 h-5"></i> 실시간 스트림
            </h2>
            <div id="message-list"></div>
        </section>

        <section class="md:col-span-2">
            <h2 class="text-lg font-semibold flex items-center gap-2 mb-4">
                <i data-lucide="check-circle-2" class="text-green-600 w-5 h-5"></i> 확정된 일정
            </h2>
            <div id="schedule-list"></div>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Sync Hub - Fixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, deleteDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbZ2BoI5pT6Yicn43HSXuU-eabNdrQ9CQ",
            authDomain: "parkjun-scheduling-automation.firebaseapp.com",
            projectId: "parkjun-scheduling-automation",
            appId: "1:705025138723:web:a1c09116fc541832ccd196"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const uidDisplay = document.getElementById('uid-display');
        const messageList = document.getElementById('message-list');
        const scheduleList = document.getElementById('schedule-list');

        signInAnonymously(auth).catch(console.error);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                uidDisplay.innerText = `나의 UID: ${user.uid}`;
                // 데이터 수신 시작
                startListening(user.uid);
            }
        });

        function startListening(uid) {
            // 1. 메시지 스트림 (경로: artifacts/auto-sync-hub/users/UID/raw_messages)
            // orderBy에서 오류가 날 수 있으므로, 처음에는 정렬 없이 가져옵니다.
            const msgQuery = query(
                collection(db, 'artifacts', 'auto-sync-hub', 'users', uid, 'raw_messages')
            );

            onSnapshot(msgQuery, (snapshot) => {
                messageList.innerHTML = snapshot.empty ? 
                    '<div class="text-slate-400 text-xs border-2 border-dashed rounded-xl p-6 text-center">메시지 대기 중...</div>' : '';
                
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    
                    const div = document.createElement('div');
                    div.className = "bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500 mb-3 relative group";
                    div.innerHTML = `
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-50 text-blue-600">
                                ${data.app || 'SMS'}
                            </span>
                            <button onclick="deleteItem('${uid}', 'raw_messages', '${id}')" class="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <div class="text-xs text-slate-500 mb-1 font-bold">${data.sender || '알 수 없음'}</div>
                        <div class="text-sm text-slate-700">${data.text || '내용 없음'}</div>
                        <button onclick="moveToSchedule('${uid}', '${id}', ${JSON.stringify(data).replace(/"/g, '&quot;')})" 
                                class="mt-3 text-[11px] text-blue-600 font-bold flex items-center gap-1 hover:underline">
                            <i data-lucide="sparkles" class="w-3 h-3"></i> 일정으로 확정하기
                        </button>
                    `;
                    messageList.appendChild(div);
                });
                lucide.createIcons();
            });

            // 2. 확정 일정 스트림
            const schedQuery = query(
                collection(db, 'artifacts', 'auto-sync-hub', 'users', uid, 'schedules')
            );

            onSnapshot(schedQuery, (snapshot) => {
                scheduleList.innerHTML = snapshot.empty ? 
                    '<div class="bg-white/50 border-2 border-dashed rounded-3xl p-10 text-center text-slate-400">등록된 일정이 없습니다.</div>' : '';
                
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    const div = document.createElement('div');
                    div.className = "bg-white p-5 rounded-2xl shadow-sm border hover:shadow-md transition-all mb-4 border-l-4 border-green-500";
                    div.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <h3 class="font-bold text-slate-800 text-lg mb-1">${data.title || '제목 없음'}</h3>
                                <div class="flex flex-wrap gap-3 text-xs text-slate-500">
                                    <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${data.startTime ? new Date(data.startTime).toLocaleString() : '시간 정보 없음'}</span>
                                    ${data.location ? `<span class="flex items-center gap-1 text-blue-600"><i data-lucide="map-pin" class="w-3 h-3"></i> ${data.location}</span>` : ''}
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="addToGoogle('${data.title}', '${data.startTime}', '${data.location || ''}')" class="p-2 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100">
                                    <i data-lucide="calendar-plus" class="w-5 h-5"></i>
                                </button>
                                <button onclick="deleteItem('${uid}', 'schedules', '${id}')" class="p-2 text-slate-300 hover:text-red-500">
                                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    scheduleList.appendChild(div);
                });
                lucide.createIcons();
            });
        }

        // 구글 캘린더 연동 함수
        window.addToGoogle = (title, time, loc) => {
            const start = new Date(time || new Date()).toISOString().replace(/-|:|\.\d\d\d/g, "");
            const url = `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${start}/${start}&location=${encodeURIComponent(loc)}`;
            window.open(url, '_blank');
        };

        // 메시지를 일정으로 이동 (AI 처리 시뮬레이션 포함)
        window.moveToSchedule = async (uid, msgId, data) => {
            if(!confirm('이 메시지를 일정으로 등록할까요?')) return;
            
            await addDoc(collection(db, 'artifacts', 'auto-sync-hub', 'users', uid, 'schedules'), {
                title: data.text.substring(0, 20), // 일단 메시지 앞부분을 제목으로
                startTime: new Date().toISOString(),
                location: "",
                createdAt: serverTimestamp()
            });
            await deleteDoc(doc(db, 'artifacts', 'auto-sync-hub', 'users', uid, 'raw_messages', msgId));
        };

        window.deleteItem = async (uid, col, id) => {
            if(confirm('삭제하시겠습니까?')) {
                await deleteDoc(doc(db, 'artifacts', 'auto-sync-hub', 'users', uid, col, id));
            }
        };

        lucide.createIcons();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 pb-20">
    <header class="bg-white border-b sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-extrabold text-slate-800 flex items-center gap-2">
                <i data-lucide="zap" class="w-6 h-6 text-blue-600"></i> Sync Hub
            </h1>
            <div id="uid-display" class="text-[10px] font-mono text-slate-400 bg-slate-50 px-3 py-1 rounded-full border">
                GQi8rx8cw4dghBOAIvDvbZE0VbK2
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 pt-8 grid grid-cols-1 md:grid-cols-12 gap-8">
        <div class="md:col-span-4">
            <h2 class="font-bold flex items-center gap-2 text-slate-700 mb-4">
                <i data-lucide="inbox" class="w-5 h-5 text-blue-500"></i> 실시간 메시지
            </h2>
            <div id="message-list" class="space-y-3"></div>
        </div>

        <div class="md:col-span-8">
            <h2 class="font-bold flex items-center gap-2 text-slate-700 mb-4">
                <i data-lucide="calendar-check" class="w-5 h-5 text-green-500"></i> 확정 일정
            </h2>
            <div id="schedule-list"></div>
        </div>
    </main>
</body>
</html>
